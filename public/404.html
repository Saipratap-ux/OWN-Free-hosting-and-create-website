<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SaipratapS❤️C</title>
  <script>
    // GitHub Pages Single Page App Redirect
    // Redirects any deep link back to repository index.html with query path
    var pathSegmentsToKeep = 1; // 1 for repo subpaths like /OWN-Free-hosting-and-create-website/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
